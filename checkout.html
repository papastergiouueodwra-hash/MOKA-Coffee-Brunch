<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOKA Checkout</title><style>:root{--cream:#f6efe4;--paper:#fffaf3;--beige:#e9dccb;--brown:#665243;--deep:#3f332a;--olive:#a9b28a;--olive-dark:#697253;--line:#d9c9b7;--muted:#89796a}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--deep);font:15px/1.6 Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:45px 22px}.brand{font:700 28px Georgia,serif;letter-spacing:.12em}.sub{font-size:10px;letter-spacing:.28em;color:var(--muted)}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:24px;margin-top:35px}.card{background:var(--paper);border:1px solid var(--line);border-radius:30px;padding:28px}.eyebrow{font-size:10px;letter-spacing:.22em;color:var(--olive-dark);font-weight:700}.title{font:400 39px Georgia,serif;margin:7px 0 25px}.options{display:flex;gap:9px;flex-wrap:wrap}.option{padding:11px 17px;border-radius:999px;border:1px solid var(--line);background:#fffdf8;color:var(--brown);cursor:pointer}.option.selected{background:var(--olive);border-color:var(--olive);color:#36402a}.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:22px}.field.full{grid-column:1/-1}label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:7px}input,textarea,select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:15px;background:#fffdf8;color:var(--deep);font:inherit;outline:0}textarea{resize:vertical}.summary{position:sticky;top:20px;height:max-content}.item{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}.totals{margin-top:18px}.row{display:flex;justify-content:space-between;margin:9px 0}.total{font-size:20px;font-weight:700;border-top:1px solid var(--line);padding-top:15px;margin-top:15px}.btn{width:100%;border:0;border-radius:999px;padding:15px 20px;background:var(--deep);color:#fff;font-weight:700;cursor:pointer;margin-top:20px}.back{display:inline-block;color:var(--brown);margin-top:20px}.success{text-align:center;padding:35px 5px}.mark{width:70px;height:70px;border-radius:50%;background:#e5ebd6;color:var(--olive-dark);display:grid;place-items:center;font-size:34px;margin:0 auto 18px}.order{background:var(--beige);border-radius:17px;padding:14px;margin:20px 0;font-weight:700}@media(max-width:760px){.grid{grid-template-columns:1fr}.summary{position:static}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="brand">MOKA</div><div class="sub">COFFEE & BRUNCH</div><div class="grid"><section class="card"><div id="checkout"><div class="eyebrow">CHECKOUT</div><h1 class="title">Almost yours.</h1><div class="eyebrow">ORDER TYPE</div><div class="options" style="margin-top:9px"><button class="option selected" data-type="Pickup">Pickup</button><button class="option" data-type="Delivery">Delivery</button></div><div class="fields"><div><label>Name</label><input id="name" placeholder="Your name"></div><div><label>Phone</label><input id="phone" placeholder="+30"></div><div><label>Email</label><input id="email" type="email" placeholder="you@example.com"></div><div id="addressWrap"><label>Address</label><input id="address" placeholder="Street & number"></div><div class="field full"><label>Payment</label><div class="options"><button class="option selected" data-pay="Card">Card · demo</button><button class="option" data-pay="Cash">Cash on pickup</button></div></div><div class="field full"><label>Order notes</label><textarea id="notes" rows="3" placeholder="Anything we should know?"></textarea></div></div><button class="btn" id="place">Place order</button><a class="back" href="/">← Back to MOKA</a></div></section><aside class="card summary"><div class="eyebrow">YOUR ORDER</div><h2 style="font:400 27px Georgia;margin:7px 0 14px">Order summary</h2><div id="items"></div><div class="totals"><div class="row"><span>Subtotal</span><span id="subtotal">€0.00</span></div><div class="row"><span>Delivery</span><span id="delivery">€0.00</span></div><div class="row total"><span>Total</span><span id="total">€0.00</span></div></div></aside></div></div><script>let type='Pickup',pay='Card';const products={1:['Espresso',2.2],2:['Double Espresso',2.8],3:['Cappuccino',3.2],4:['Freddo Cappuccino',3.5],5:['Iced Latte',3.8],6:['Cold Brew',4],7:['Avocado Toast',7.9],8:['Pancakes',8.5],9:['Eggs Benedict',9.5],10:['Club Sandwich',8.9],11:['Croissant',2.8],12:['Cheesecake',5.2]};function render(){let cart=JSON.parse(localStorage.getItem('mokaCart')||'[]');let box=document.getElementById('items');if(!cart.length){box.innerHTML='<p style="color:var(--muted)">Your cart is empty.</p>';return}let sub=0;box.innerHTML=cart.map(x=>{let p=products[x.id];let t=p[1]*x.qty;sub+=t;return `<div class="item"><span>${p[0]} × ${x.qty}</span><b>€${t.toFixed(2)}</b></div>`}).join('');let fee=type==='Delivery'?2.5:0;document.getElementById('subtotal').textContent='€'+sub.toFixed(2);document.getElementById('delivery').textContent='€'+fee.toFixed(2);document.getElementById('total').textContent='€'+(sub+fee).toFixed(2)}document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-type]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');type=b.dataset.type;document.getElementById('addressWrap').style.display=type==='Delivery'?'block':'none';render()});document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-pay]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');pay=b.dataset.pay});document.getElementById('place').onclick=()=>{let name=document.getElementById('name').value.trim();if(!name){alert('Please add your name');return}let id='MOKA-'+Math.floor(1000+Math.random()*9000);let total=document.getElementById('total').textContent;document.getElementById('checkout').innerHTML=`<div class="success"><div class="mark">✓</div><div class="eyebrow">ORDER CONFIRMED</div><h1 class="title">You're all set, ${name}.</h1><p style="color:var(--muted)">Your ${type.toLowerCase()} order has been received.</p><div class="order">#${id} · ${total}</div><p><b>Estimated time: 15–20 min</b></p><p style="color:var(--muted)">Demo checkout — no real payment was charged.</p><a class="btn" style="display:block;text-decoration:none" href="/">Back to MOKA</a></div>`;localStorage.removeItem('mokaCart')};document.getElementById('addressWrap').style.display='none';render();</script></body></html>
